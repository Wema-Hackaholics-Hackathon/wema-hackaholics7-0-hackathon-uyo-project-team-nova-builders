[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "backend"
version = "0.1.0"
description = "FOID — Identity & Digital Risk Assessment backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.42",
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "groq>=0.18.0",
    "slowapi>=0.1.10",
    "redis>=5.2.0",
    "argon2-cffi>=25.1.0",
    "pydantic[email]>=2.13.5",
    "fpdf2>=2.8.8",
    "numpy>=2.5.4",
    "opencv-python-headless==4.10.0.84",
]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0", # for TestClient
    "anyio>=4.0.0",
    "basedpyright>=1.40.1",
]

[project.scripts]
foid      = "app.__main__:serve"
foid-dev  = "app.__main__:serve_dev"
foid-test = "app.__main__:run_tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
# Circular imports under TYPE_CHECKING are an intentional SQLModel pattern
reportImportCycles = "none"
