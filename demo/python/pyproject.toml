[project]
name = "harbor-demo-python"
version = "0.1.0"
description = "Harbor — a pretend business using the FOID Python SDK"
requires-python = ">=3.10"
dependencies = [
    "foid[keypair]",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.uv.sources]
# The SDK is installed from a packaged wheel, the same way it would come from PyPI.
# Refresh it with ../scripts/pack-sdks.sh after changing sdks/python.
foid = { path = "vendor/foid-0.1.0-py3-none-any.whl" }
